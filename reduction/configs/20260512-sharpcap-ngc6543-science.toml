# Same-session NGC 6543 sequence.  The full workflow replaces the placeholder
# wavelength mode with the selected Vega solution, then refines it against the
# unambiguous nebular emission-line pattern.
[inputs]
root = "<local-sharpcap-root>"
target_name = "NGC6543"
science = ["2026-05-12/NGC 6543/*/*.fits"]
flat = []
bias = []
dark = []
arc = []
output_dir = "../output/NGC6543/2026-05-12/runs/science"

[detector]
gain_e_per_adu = 0.06311
read_noise_e = 1.1
saturation_adu = 65520.0

[orientation]
dispersion_axis = 1
red_left_blue_right = true
horizontal_flip = true

[preprocess]
align_frames = true
align_spatial = true
align_dispersion = true
maximum_shift_pixels = 20.0
combine_method = "mean"
sigma_clip = 4.5
use_bias = false
use_dark = false
use_flat = false
# Seven frames allow reliable temporal cosmic-ray rejection without eroding
# bright, spatially extended nebular emission lines.
cosmic_ray_clean = false
normalize_science_exposure = true
reject_mixed_camera_gain = true
reject_unalignable_frames = true
minimum_alignment_confidence = 0.10
alignment_probe_shift_pixels = 90.0
auto_detect_sdk_wrap = false
sdk_wrap_shift_pixels = 64
sdk_wrap_seam_sigma = 4.0
minimum_flat_frames = 2
maximum_flat_saturation_fraction = 0.006
minimum_flat_valid_fraction = 0.50

[extraction]
backend = "aspired"
allow_native_fallback = true
trace_bins = 24
trace_half_width = 65
trace_degree = 2
minimum_trace_snr = 3.0
minimum_valid_trace_bins = 5
allow_low_confidence_trace = false
aperture_half_width = 30
sky_separation = 12
sky_width = 24
optimal = false
aspired_faint_percent = 15.0
minimum_valid_fraction = 0.5
maximum_optimal_to_boxcar_peak_ratio = 8.0
maximum_optimal_to_boxcar_noise_ratio = 4.0

[wavelength]
mode = "solution_file"
solution_path = "../output/Vega/2026-05-12/final/spectrum.fits"
polynomial_degree = 2
medium = "air"
minimum_angstrom = 3600.0
maximum_angstrom = 7600.0
minimum_matched_lines = 4
maximum_rms_angstrom = 4.0
minimum_pixel_span_fraction = 0.45
minimum_template_correlation = 0.30
stellar_feature_prominence = 0.010
stellar_feature_tolerance_pixels = 55.0
minimum_wavelength_span_angstrom = 2800.0
minimum_abs_dispersion_angstrom_per_pixel = 0.3
maximum_abs_dispersion_angstrom_per_pixel = 2.0
auto_reverse_output = true
