# Denoised Albireo-B trial: conservative per-frame L.A.Cosmic followed by
# aligned sigma-clipped mean.  The original median product remains untouched.
[inputs]
root = "<local-data-root>"
target_name = "Albireo-B-clean"
science = ["20260504/6CYGB-*.fit"]
flat = []
bias = []
dark = []
arc = []
output_dir = "../output/Albireo/2026-05-04/runs/B-clean"

[detector]
gain_e_per_adu = 1.0
read_noise_e = 6.5
saturation_adu = 255.0

[orientation]
dispersion_axis = 1
red_left_blue_right = true
horizontal_flip = true

[preprocess]
align_frames = true
maximum_shift_pixels = 12.0
sigma_clip = 4.5
combine_method = "mean"
use_bias = false
use_dark = false
use_flat = false
cosmic_ray_clean = true
normalize_science_exposure = true
reject_mixed_camera_gain = true
reject_unalignable_frames = true
minimum_alignment_confidence = 0.05
alignment_probe_shift_pixels = 90.0
auto_detect_sdk_wrap = false
sdk_wrap_shift_pixels = 64
sdk_wrap_seam_sigma = 4.0
minimum_flat_frames = 2
maximum_flat_saturation_fraction = 0.006
minimum_flat_valid_fraction = 0.50

[extraction]
backend = "aspired"
allow_native_fallback = true
trace_bins = 24
trace_half_width = 40
trace_degree = 2
minimum_trace_snr = 3.0
minimum_valid_trace_bins = 5
allow_low_confidence_trace = false
aperture_half_width = 14
sky_separation = 10
sky_width = 18
optimal = true
aspired_faint_percent = 15.0
minimum_valid_fraction = 0.5
maximum_optimal_to_boxcar_peak_ratio = 8.0
maximum_optimal_to_boxcar_noise_ratio = 4.0

[wavelength]
mode = "known_pairs"
polynomial_degree = 1
# Same three-line H-gamma/H-beta/H-alpha solution as the baseline product;
# cleaning is not allowed to move the wavelength anchors.
known_pixels = [168.5, 712.2, 2514.2]
known_angstroms = [4340.47, 4861.35, 6562.79]
medium = "air"
minimum_angstrom = 4100.0
maximum_angstrom = 8000.0
minimum_matched_lines = 3
maximum_rms_angstrom = 4.0
minimum_pixel_span_fraction = 0.60
